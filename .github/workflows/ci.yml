name: Validate DRAX
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      neural:
        description: Run the optional public-model retrieval benchmark
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: ruff check backend/app backend/tests scripts
      - run: pytest -q
      - run: PYTHONPATH=backend python scripts/evaluate.py --gate
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  neural:
    if: github.event_name == 'workflow_dispatch' && inputs.neural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r backend/requirements-semantic.txt
      - run: PYTHONPATH=backend python scripts/evaluate.py --neural --gate --output neural-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: neural-retrieval-results
          path: neural-results.json
